
name: Build NOVA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        working-directory: NOVA-Fabric-1.21.11-cloud-build/NOVA-Fabric-1.21.11
        run: gradle build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Fabric-1.21.11
          path: NOVA-Fabric-1.21.11-cloud-build/NOVA-Fabric-1.21.11/build/libs/*.jar
